ackground:#fbdce6;border-color:#b85876}.bar{height:10px;background:#e5e9e9;border-radius:10px;overflow:hidden}.bar div{height:100%;background:#39719c;transition:width .25s}.scene{font-size:clamp(20px,3vw,28px);font-weight:bold;background:#f8d5e7;border-radius:16px;padding:24px;margin:16px 0;text-align:center}.hidden{display:none!important}#robot{width:100%;max-height:380px}#stage{background:#e1f3f3;border-radius:16px;text-align:center;padding:10px}.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}@media(max-width:680px){main{margin:10px 12px 20px;padding:16px;border-left-width:8px}.grid{grid-template-columns:1fr}.options{grid-template-columns:1fr}.option{flex-direction:row;text-align:left}.option img{width:84px;height:76px}}@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

</style></head><body><main><header class="hero"><span class="tag">활동 1 · 로봇의 구조와 활용</span><h1>나만의 로봇 설계소</h1><p>어떤 일을 도와주는 로봇이 필요할까요? 나만의 로봇을 꾸미고 소개해요.</p></header><div class="grid"><section class="panel"><h2>로봇 미리 보기</h2><div id="stage"><svg id="robot" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 310"></svg></div><div class="row2"><div><label for="head">머리</label><select id="head"><option value="round">둥근 머리</option><option value="square">네모 머리</option><option value="oval">타원 머리</option></select></div><div><label for="body">몸통</label><select id="body"><option value="round">둥근 몸통</option><option value="square">네모 몸통</option><option value="oval">타원 몸통</option></select></div><div><label for="arms">팔</label><select id="arms"><option value="hand">로봇 손</option><option value="claw">집게 팔</option><option value="none">팔 없음</option></select></div><div><label for="legs">이동 방식</label><select id="legs"><option value="feet">두 다리</option><option value="wheel">바퀴</option><option value="track">무한궤도</option></select></div></div><label for="color">로봇 색상</label><select id="color"><option value="#83BCE8">하늘색</option><option value="#A8E6DF">민트색</option><option value="#F7B6C2">분홍색</option><option value="#F8D87C">노란색</option><option value="#C8B7E8">보라색</option></select></section><section class="panel"><h2>나의 로봇 소개 카드</h2><label for="name">로봇 이름</label><input id="name" maxlength="24" placeholder="예: 척척이"><label for="job">기능 (어떤 일을 하나요?)</label><textarea id="job" maxlength="120" placeholder="예: 바닥을 청소하고 물건을 정리해요."></textarea><label for="reason">만든 까닭</label><textarea id="reason" maxlength="120" placeholder="예: 가족의 집안일을 도와주고 싶어요."></textarea><label for="when">어떤 상황에서 필요할까요?</label><textarea id="when" maxlength="120" placeholder="예: 가족이 바쁠 때"></textarea><details><summary>더 도전! 로봇의 세 가지 장치 (개념 학습 후)</summary><label for="sensor">감지 장치(센서)</label><select id="sensor"><option>아직 선택하지 않음</option><option>거리 센서</option><option>빛 센서</option><option>소리 센서</option><option>온도 센서</option><option>카메라</option></select><label for="control">제어 장치가 판단할 일</label><input id="control" maxlength="80" placeholder="예: 장애물이 있으면 방향을 바꿔요."><label for="drive">구동 장치</label><select id="drive"><option>아직 선택하지 않음</option><option>바퀴를 움직이는 모터</option><option>팔을 움직이는 모터</option><option>다리를 움직이는 모터</option><option>무한궤도를 움직이는 모터</option></select></details><div class="actions"><button id="save">설계 카드 이미지 저장</button><button class="secondary" id="reset">처음부터</button></div><p id="msg" role="status" class="muted"></p></section></div><div class="note">완성한 로봇을 친구에게 소개하고, 왜 필요한지 이야기해 봐요.</div></main><script>const $=id=>document.getElementById(id);const ids=['head','body','arms','legs','color','name','job','reason','when','sensor','control','drive'];function render(){let c=$('color').value,h=$('head').value,b=$('body').value,a=$('arms').value,l=$('legs').value;let head=h==='oval'?`<ellipse cx="160" cy="78" rx="73" ry="49" fill="${c}"/>`:`<rect x="86" y="30" width="148" height="96" rx="${h==='round'?36:9}" fill="${c}"/>`;let torso=b==='oval'?`<ellipse cx="160" cy="186" rx="53" ry="53" fill="${c}"/>`:`<rect x="108" y="135" width="104" height="102" rx="${b==='round'?30:8}" fill="${c}"/>`;let arms=a==='none'?'':`<path d="M108 152 L70 179 L48 155 M212 152 L250 179 L272 155" stroke="${c}" stroke-width="20" fill="none"/><path d="M108 152 L70 179 L48 155 M212 152 L250 179 L272 155" stroke-width="3" fill="none"/>`+(a==='hand'?'<circle cx="46" cy="150" r="13" fill="#F7B6C2"/><circle cx="274" cy="150" r="13" fill="#F7B6C2"/>':'<path d="M35 140 L46 153 L57 140 M263 140 L274 153 L285 140" fill="none" stroke-width="7"/>');let feet=l==='wheel'?'<circle cx="123" cy="254" r="22" fill="#39719c"/><circle cx="197" cy="254" r="22" fill="#39719c"/><circle cx="123" cy="254" r="8" fill="#fff"/><circle cx="197" cy="254" r="8" fill="#fff"/>':l==='track'?'<rect x="93" y="234" width="134" height="42" rx="20" fill="#39719c"/><circle cx="115" cy="255" r="10" fill="#A8E6DF"/><circle cx="160" cy="255" r="10" fill="#A8E6DF"/><circle cx="205" cy="255" r="10" fill="#A8E6DF"/>':'<rect x="122" y="234" width="24" height="34" rx="8" fill="#A8E6DF"/><rect x="174" y="234" width="24" height="34" rx="8" fill="#A8E6DF"/><rect x="108" y="259" width="42" height="18" rx="8" fill="#39719c"/><rect x="170" y="259" width="42" height="18" rx="8" fill="#39719c"/>'; $('robot').innerHTML=`<ellipse cx="160" cy="287" rx="95" ry="9" fill="#c2dddd"/><g stroke="#1F3A6E" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"><path d="M160 30 V13"/><circle cx="160" cy="12" r="8" fill="#F7B6C2"/>${head}<rect x="103" y="49" width="114" height="60" rx="20" fill="#1F3A6E"/><path d="M120 75 Q130 57 140 75 M180 75 Q190 57 200 75" fill="none" stroke="#A8E6DF" stroke-width="5"/><path d="M146 85 Q160 106 174 85Z" fill="#A8E6DF" stroke="none"/><circle cx="117" cy="90" r="5" fill="#F7B6C2" stroke="none"/><circle cx="203" cy="90" r="5" fill="#F7B6C2" stroke="none"/>${arms}${feet}${torso}<rect x="130" y="158" width="60" height="48" rx="11" fill="#fff"/><path d="M160 192 C125 169 153 155 160 171 C167 155 195 169 160 192" fill="#F7B6C2" stroke="none"/></g>`;}ids.forEach(id=>$(id).addEventListener('input',render));render();$('reset').onclick=()=>{if(!confirm('작성한 내용을 모두 지울까요?'))return;ids.forEach(id=>{let e=$(id);if(e.tagName==='SELECT')e.selectedIndex=0;else e.value=''});render();$('msg').textContent='';};function wrap(ctx,text,max){let lines=[],line='';for(let ch of text){if(ch==='\n'||ctx.measureText(line+ch).width>max){lines.push(line);line=ch==='\n'?'':ch}else line+=ch}if(line)lines.push(line);return lines.length?lines:[''];} $('save').onclick=async()=>{if(!['name','job','reason','when'].every(id=>$(id).value.trim())){$('msg').textContent='이름, 기능, 만든 까닭, 필요한 상황을 모두 적어 주세요.';return;}try{let cv=document.createElement('canvas');cv.width=1400;let ctx=cv.getContext('2d');ctx.font='27px sans-serif';let fields=[['로봇 이름','name'],['기능','job'],['만든 까닭','reason'],['필요한 상황','when']];if($('sensor').selectedIndex||$('control').value.trim()||$('drive').selectedIndex)fields.push(['감지 장치','sensor'],['제어 장치','control'],['구동 장치','drive']);let data=fields.map(([k,v])=>[k,wrap(ctx,$(v).value||'미작성',750)]);cv.height=Math.max(780,160+data.reduce((n,[k,ls])=>n+55+ls.length*36,0));ctx.fillStyle='#fdfbf4';ctx.fillRect(0,0,cv.width,cv.height);ctx.fillStyle='#39719c';ctx.fillRect(0,0,cv.width,100);ctx.fillStyle='white';ctx.font='bold 42px sans-serif';ctx.fillText('나만의 로봇 설계 카드',45,65);ctx.fillStyle='#d9f1ee';ctx.fillRect(35,140,480,500);let blob=new Blob([new XMLSerializer().serializeToString($('robot'))],{type:'image/svg+xml;charset=utf-8'}),url=URL.createObjectURL(blob),im=new Image();await new Promise((ok,no)=>{im.onload=ok;im.onerror=no;im.src=url});ctx.drawImage(im,45,155,460,460);URL.revokeObjectURL(url);let y=155;for(let [k,ls] of data){ctx.fillStyle='#39719c';ctx.font='bold 25px sans-serif';ctx.fillText(k,565,y);y+=38;ctx.font='27px sans-serif';ctx.fillStyle='#493b13';for(let line of ls){ctx.fillText(line,565,y);y+=36}y+=17;}cv.toBlob(b=>{if(!b){$('msg').textContent='이미지 저장에 실패했어요.';return}let a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='나만의_로봇_설계카드.png';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1500);$('msg').textContent='이미지 저장을 요청했어요. 다운로드 폴더를 확인해 주세요.';},'image/png');}catch(e){$('msg').textContent='이미지 저장에 실패했어요. 다른 브라우저에서 다시 시도해 주세요.';}};</script></body></html>
